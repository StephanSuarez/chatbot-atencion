# ponytail: misma versión mayor que Supabase (Postgres 17, verificado 2026-09-14), con pgvector (002).
services:
  db:
    # trixie: misma glibc que postgres:17; con bookworm el volumen existente avisa de collation distinta.
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
